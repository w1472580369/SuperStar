name: 刷课
 
on: 
  push:
    branches: [ main ]
  #是否开始每天8点定时刷课，若要开启请把下面两行注释去掉
  #schedule:
  #  - cron: "0 8 * * *" 

permissions:
  contents: write

jobs: 
  Start:
    runs-on: ubuntu-latest # 在最新版本的 Ubuntu 操作系统环境下运行
    steps: # 要执行的步骤
      - name: 拷贝代码
        uses: actions/checkout@v4  # 用于将github代码仓库的代码拷贝到工作目录中
 
      - name: 设置python环境
        uses: actions/setup-python@v5 # 用于设置 Python 环境，它允许你指定要在工作环境中使用的 Python 版本
        with:
          python-version: '3.13'  # 选择要用的Python版本

      - name: 安装依赖包
        run: | # 安装依赖包
          pip install -r ./requirements.txt
          pip install -r ./deepseek-web2api/requirements.txt

      - name: 启动 DeepSeek 代理(本地AI题库)
        env:
          DEEPSEEK_TOKEN_1: ${{ secrets.DEEPSEEK_TOKEN }}
          DEEPSEEK_COOKIES_1: ${{ secrets.DEEPSEEK_COOKIES }}
        run: |
          python start_deepseek_proxy.py -c config.ini > /tmp/ds2api.log 2>&1 &
          echo $! > /tmp/ds2api.pid

      - name: 等待 DeepSeek 代理就绪
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/health | grep -q 200; then
              echo "代理已就绪"
              exit 0
            fi
            sleep 2
          done
          echo "代理启动失败，日志:"
          cat /tmp/ds2api.log
          exit 1
      
      - name: Run main.py
        env:
          CHAOXING_USERNAME: ${{ secrets.CHAOXING_USERNAME }}
          CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
          CHAOXING_COURSE_LIST: ${{ secrets.CHAOXING_COURSE_LIST }}
        run: python main.py -u 16665166519 -p 1472580369Qq@ -l 235890000

      - name: 提交作业PDF到仓库
        if: always() # main.py 中途失败也提交已生成的PDF
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add homework_pdf/
          if git diff --cached --quiet; then
            echo "无新PDF, 跳过提交"
            exit 0
          fi
          # [skip ci] 防止推送再次触发本 workflow 形成循环
          git commit -m "docs: 更新作业PDF [skip ci]"
          git push

[common]
; 使用cookie登录，填写true则忽略账号密码，直接从cookies.txt读取cookie登录
use_cookies=false

; 手机号账号(必填)
username = xxx

; 登录密码(必填)
password = xxx

; 要学习的课程ID列表, 逗号隔开(选填，不需要则留空)
course_list = xxx,xxx,xxx

; 视频播放倍速(默认1，最大2)
speed = 1

; 同时进行的章节数量
jobs = 1

; 遇到关闭任务点时的行为: retry-重试(默认), continue-继续
notopen_action = retry

; 刷课模块开关: 1=学习章节任务点(默认), 0=关闭刷课(可只跑作业, 见 [homework] 节)
study = 0
[tiku]
; 可选项 :
; 1. TikuYanxi(言溪题库 https://tk.enncy.cn/)
; 2. TikuLike(LIKE知识库 https://www.datam.site/)
; 3. TikuAdapter(开源项目 https://github.com/DokiDoki1103/tikuAdapter)
; 4. AI(需自行寻找兼容openai格式的API Endpoint和Key)
; 5. SiliconFlow(硅基流动AI：https://siliconflow.cn/)
; 6. TikuGo(GO题/网课小工具题库 https://q.icodef.com/)
; 7. TikuXxtmooc(SuperTiKu聚合题库 http://tk.xxtmooc.com/ 参考 https://github.com/Dainoar/SuperAutoStudy)
; 8. DeepSeekWeb2API(本地 deepseek-web2api 代理, 独立配置见 [deepseek_web2api] 节)
; 支持配置多个题库回退，按顺序依次查询，示例：provider=TikuGo,TikuYanxi,TikuLike
; AI 与 DeepSeekWeb2API 可同时启用(如 provider=TikuYanxi,TikuGo,AI,DeepSeekWeb2API)，各自读取独立配置节
provider=TikuYanxi,TikuGo,AI

; 是否启用大模型连接检查，填写 true 表示在启动时检查大模型连接是否可用，false 表示不检查
; 仅在使用 AI 或 SiliconFlow 题库时生效，会消耗少量token
check_llm_connection=true

; 是否提交答题，填写false表示答完题后不提交而是保存搜到的题目，随后你可以自行前往学习通修改或提交
; 填写true表示达到最低题库覆盖率提交，没达到只保存搜到的题目，进入下一章节，不保证正确率！不正确的填写会被视为false
; 题库覆盖率-搜到的题目占总题目的比例
; 对于那些需要解锁的章节，你必须要提交章节检测才能继续下一章节的学习，自行决定是否开启
; 选择提交答题但题库覆盖率不达标时，若是需要解锁的章节，保存后会回滚重新答题且忽略搜到率提交
submit=true

; 最低题库覆盖率
cover_rate=1

; 搜索多个题目时间隔的时间，单位秒
delay=1.0

; 用于言溪题库的TOKEN，同样使用英文逗号隔开多个，会按顺序去使用
; 或用于LIKE知识库的TOKEN，在使用LIKE知识库时会随机调用token进行查询。
tokens=586a366832d743ad937191ba4f55bee6,c3182ace5f864ac3a50d0367dee420f7,bc62d95c6cf442a1aae017566329f64e,ab096a3a101a4812900cb971e04f018b,1595bbd3e1cd4661bd0b11bf1383659d,d69bfeae5a744f6e8fdc209b2bbc9683,13c398dbec6e46b1966749d14a149576,a262b32a537a40fd95e66c89c5cf04a0,5ac888ec2f62488f857617409f51d929,4f461dffe7964caa94038954a0081ab2,2712ec898aa04afc949472418867db13

; 下面是用于LIKE知识库模型的专属配置，其他题库无需关注下列选项
; likeapi_search=true表示启用模型的联网搜索功能，false则不启用联网搜索
; likeapi_vision=true表示启用模型的视觉能力，false则不启用视觉能力（可以识别图片中的内容并进行答题，支持超星url格式的文本图片题）
; likeapi_model=glm-4.5-air表示使用glm-4.5-air模型，其他模型请自行查询
; likeapi_retry=true表示启用自动重试功能，false则关闭该功能
; likeapi_retry_times设置最大重试次数
; 模型支持列表：https://www.datam.site/dashboard/pricing
likeapi_search=false
likeapi_vision=true
likeapi_model=glm-4.5-air
likeapi_retry=true
likeapi_retry_times=3
; 用于TikuAdapter题库的url
url=

; 用于GO题（网课小工具题库）的配置
; go_authorization 为公众号"一之哥哥"中申请到的解除限流的Token（可选）
; go_min_interval 设置请求GO题库的最小时间间隔，单位秒，默认为1.0秒
; go_retry_times 设置请求GO题库的重试次数，默认为3次
; go_retry_backoff 设置请求GO题库的重试指数退避基数，默认为1.2倍
go_authorization=kLLzcoBMo4sshPjf
go_min_interval=1.0
go_retry_times=3
go_retry_backoff=1.2

; 用于TikuXxtmooc(SuperTiKu聚合题库)的配置
; xxtmooc_url 设置题库接口地址（可选，默认 http://tk.xxtmooc.com/api/q）
; xxtmooc_timeout 设置请求超时时间，单位秒，默认为15秒
xxtmooc_url=http://tk.xxtmooc.com/api/q
xxtmooc_timeout=15

; AI大模型答题(含本地 deepseek-web2api 代理)的独立配置已抽离到下方 [ai] 节

;硅基流动AI专属配置，以siliconflow开头的
;硅基流动获取token的地址https://cloud.siliconflow.cn/account/ak
siliconflow_key = 
;可选模型deepseek-ai/DeepSeek-R1;deepseek-ai/DeepSeek-V3等，这里查看https://docs.siliconflow.cn/cn/api-reference/chat-completions/chat-completions
siliconflow_model = deepseek-ai/DeepSeek-R1
; 可选自定义端点
siliconflow_endpoint = https://api.siliconflow.cn/v1/chat/completions
; 硅基流动请求间隔时间，单位秒，默认3
min_interval_seconds = 3

; 用于判断判断题对应的选项，不要留有空格，不要留有引号，逗号为英文逗号
true_list=正确,对,√,是
false_list=错误,错,×,否,不对,不正确
[ai]
; AI 大模型答题独立配置(通用 OpenAI 兼容接口, 仅保留答题必需项)
; 适用于自带 OpenAI 兼容 API 的场景；本地 deepseek-web2api 代理请见下方 [deepseek_web2api] 节

; endpoint: 兼容 OpenAI 格式的 API 地址，可能需要带 /v1 路径，例如 https://example.com/v1
endpoint=https://discovery-api.intern-ai.org.cn/v1
; key: API 密钥
key=sk-5edd0b11f28c56b5b3dff75a6b19861effc27a48f7835b895053066dc64a25b0
; model: 请求使用的模型名
model=Agents-A1
; min_interval_seconds: API 请求最小间隔时间，单位秒，0表示不限制
min_interval_seconds=1
; http_proxy: 请求大模型时使用的代理(可选)，填写示例：http://examples.com
http_proxy=

[deepseek_web2api]
; DeepSeekWeb2API(本地 deepseek-web2api 代理)独立配置(仅保留答题必需项)
; 与 AI 答题逻辑一致，可同时启用并通过 provider 参数分别控制
; 需先启动 deepseek-web2api 服务, 推荐用 start_deepseek_proxy.py 启动, 会自动读取本节凭证

; token: DeepSeek 账号凭证之一, 从 chat.deepseek.com 浏览器DevTools获取(对应环境变量 DEEPSEEK_TOKEN)
; cookies: DeepSeek 账号凭证之一, 从 chat.deepseek.com 浏览器DevTools获取(对应环境变量 DEEPSEEK_COOKIES)
; 填写后启动脚本会注入 DEEPSEEK_TOKEN/DEEPSEEK_COOKIES；两项均留空时回退读取环境变量或 deepseek-web2api/.env
token=
cookies=

; endpoint: 本地代理地址，通常带 /v1 路径
endpoint=http://127.0.0.1:8080/v1
; key: 代理未开启鉴权时可填任意占位值
key=local-proxy-placeholder
; model: 请求使用的模型名
model=deepseek-chat
; min_interval_seconds: API 请求最小间隔时间，单位秒，0表示不限制
min_interval_seconds=0
; http_proxy: 请求代理(可选)，填写示例：http://examples.com
http_proxy=


[homework]
; 独立课程作业(作业中心)答题配置
; 随刷课模块完成后自动触发(见 enable), 或用 --homework-only 单独运行
; enable: 1=刷课模块完成后再运行作业答题, 0=不启用
enable=1
; pdf: 1=将每份作业的题面与脚本答案生成 PDF 保存到 homework_pdf/ 目录, 0=不生成
pdf=1
; submit: true=搜题覆盖率达标后提交(pyFlag空), false=仅保存不提交(pyFlag=1)
submit=false
; cover_rate: 作业最低搜题覆盖率(0~100), 达到才提交, 否则仅保存, 单位百分数
cover_rate=100
; delay: 每题查询时间间隔, 单位秒
delay=1.0
[notification]
provider=ServerChan
; 可选项 :
; 1. ServerChan(Server酱 多平台推送 https://sct.ftqq.com/)
; 2. Qmsg(Qmsg酱 qq推送 https://qmsg.zendee.cn/)
; 3. Bark(Bark ios推送 https://bark.day.app/)
; 4. Telegram(Telegram Bot推送 https://api.telegram.org/  可以使用第三方中转API)
; 外部通知服务的提供方
url=https://sctapi.ftqq.com/SCT430733TOmSyf7ZkyxJzE3IRkOm9oh6c.send
; Server酱,Qmsg酱或Bark的url,以下为例子，需要自己将key填入*号位置
; https://sctapi.ftqq.com/****************.send Server酱
; https://qmsg.zendee.cn/send/**************** Qmsg酱
; https://api.day.app/**************/ Bark的高级用法请自行查阅app与其文档的说明（高级用法不一定能行，没测试过）
; https://api.telegram.org/bot**********:***********************/sendMessage Telegram(具体用法请查阅Telegram官方API文档)
; Telegram推送时使用的chat_id
tg_chat_id=XXXXXX
